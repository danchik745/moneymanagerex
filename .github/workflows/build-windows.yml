name: Build Windows Installer (.exe)

on:
  push:
    branches: [ "master", "custom-features" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          vcpkg install curl:x64-windows

      - name: Install Gettext Tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\gettext"
          nuget install Gettext.Tools -OutputDirectory "C:\gettext" -ExcludeVersion
          $msgfmt = (Get-ChildItem -Path "C:\gettext" -Filter "msgfmt.exe" -Recurse | Select-Object -First 1).FullName
          $msgmerge = (Get-ChildItem -Path "C:\gettext" -Filter "msgmerge.exe" -Recurse | Select-Object -First 1).FullName
          $binDir = Split-Path $msgfmt -Parent
          Write-Host "Found msgfmt at: $msgfmt"
          Write-Host "Found msgmerge at: $msgmerge"
          
          $binDir >> $env:GITHUB_PATH
          $msgfmtClean = $msgfmt.Replace('\', '/')
          $msgmergeClean = $msgmerge.Replace('\', '/')
          "MSGFMT_PATH=$msgfmtClean" >> $env:GITHUB_ENV
          "MSGMERGE_PATH=$msgmergeClean" >> $env:GITHUB_ENV

      - name: Download precompiled wxWidgets with WebView
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\wxWidgets"
          cd C:\wxWidgets
          Write-Host "Downloading wxWidgets 3.3.2..."
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.2/wxWidgets-3.3.2-headers.7z" -o headers.7z
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.2/wxMSW-3.3.2_vc14x_x64_Dev.7z" -o dev.7z
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.2/wxMSW-3.3.2_vc14x_x64_ReleaseDLL.7z" -o dll.7z
          
          7z x headers.7z -y
          7z x dev.7z -y
          7z x dll.7z -y
          
          Write-Host "wxWidgets extracted successfully!"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DwxWidgets_ROOT_DIR="C:/wxWidgets" `
            -DwxWidgets_LIB_DIR="C:/wxWidgets/lib/vc14x_x64_dll" `
            -DwxWidgets_CONFIGURATION=mswu `
            -DwxWidgets_USE_REL_AND_DBG=0 `
            -DGETTEXT_MSGMERGE_EXECUTABLE="$env:MSGMERGE_PATH" `
            -DGETTEXT_MSGFMT_EXECUTABLE="$env:MSGFMT_PATH"

      - name: Build MoneyManagerEx
        run: |
          cmake --build build --config Release --parallel

      - name: Copy wxWidgets Runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "C:\wxWidgets\lib\vc14x_x64_dll\*.dll" "build\bin\Release\" -Force -ErrorAction SilentlyContinue

      - name: Create Installer or Archive (.exe / .zip)
        shell: pwsh
        run: |
          cd build
          cpack -C Release -G "NSIS;ZIP"
          Get-ChildItem -Path . -Recurse -Include *.exe, *.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerEx-Windows-Exe
          path: |
            build/*.exe
            build/*.zip
            build/bin/Release/*.exe