name: Build Windows Installer (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, custom-features ]

jobs:
  build:
    name: Build Windows x64 .exe
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate database headers
        shell: cmd
        run: |
          cd src\table
          python ..\..\util\sqlite2cpp.py ..\..\database\tables.sql
          python ..\..\util\sqliteupgrade2cpp.py ..\..\database\incremental_upgrade
          del tables*.sql patch*.sql 2>nul || exit 0

      - name: Download Precompiled wxWidgets with WebView
        shell: pwsh
        run: |
          $wxVer = "3.2.6"
          $wxDir = "C:\wxWidgets"
          New-Item -ItemType Directory -Force -Path $wxDir
          
          Write-Host "Downloading wxWidgets..."
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v$wxVer/wxWidgets-$wxVer-headers.7z" -o "$env:TEMP\wx_headers.7z"
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v$wxVer/wxMSW-${wxVer}_vc14x_x64_Dev.7z" -o "$env:TEMP\wx_dev.7z"
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v$wxVer/wxMSW-${wxVer}_vc14x_x64_ReleaseDLL.7z" -o "$env:TEMP\wx_dll.7z"
          
          7z x "$env:TEMP\wx_headers.7z" -o"$wxDir" -y | Out-Null
          7z x "$env:TEMP\wx_dev.7z" -o"$wxDir" -y | Out-Null
          7z x "$env:TEMP\wx_dll.7z" -o"$wxDir" -y | Out-Null

          # Find exact lib folder name
          $libFolder = Get-ChildItem -Path "$wxDir\lib" -Directory | Select-Object -First 1
          Write-Host "Found lib folder: $($libFolder.FullName)"
          
          echo "WXWIN=$wxDir" >> $env:GITHUB_ENV
          echo "wxWidgets_ROOT_DIR=$wxDir" >> $env:GITHUB_ENV
          echo "wxWidgets_LIB_DIR=$($libFolder.FullName)" >> $env:GITHUB_ENV

      - name: Install Curl and SQLite
        run: |
          vcpkg install curl:x64-windows sqlite3:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="C:/wxWidgets;C:/vcpkg/installed/x64-windows" `
            -DwxWidgets_ROOT_DIR="C:/wxWidgets" `
            -DwxWidgets_USE_REL_AND_DBG=0 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCPACK_GENERATOR="NSIS;ZIP"

      - name: Build and Package
        run: |
          cmake --build build --config Release --target package

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerEx-Windows-Exe
          path: |
            build/*.exe
            build/*.zip
          if-no-files-found: warn