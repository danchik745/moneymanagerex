name: Build Windows Installer (.exe)

on:
  push:
    branches: [ "master", "custom-features" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tools & Dependencies
        run: |
          choco install gettext -y --no-progress
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
          vcpkg install curl:x64-windows

      - name: Download precompiled wxWidgets with WebView
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\wxWidgets"
          cd C:\wxWidgets
          Write-Host "Downloading wxWidgets 3.2.6..."
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxWidgets-3.2.6-headers.7z" -o headers.7z
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_Dev.7z" -o dev.7z
          curl.exe -fsSL "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.6/wxMSW-3.2.6_vc14x_x64_ReleaseDLL.7z" -o dll.7z
          
          7z x headers.7z -y
          7z x dev.7z -y
          7z x dll.7z -y
          
          Write-Host "wxWidgets extracted successfully!"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DwxWidgets_ROOT_DIR="C:/wxWidgets" `
            -DwxWidgets_LIB_DIR="C:/wxWidgets/lib/vc14x_x64_dll" `
            -DwxWidgets_CONFIGURATION=mswu `
            -DwxWidgets_USE_REL_AND_DBG=0 `
            -DGETTEXT_MSGMERGE_EXECUTABLE="C:/ProgramData/chocolatey/bin/msgmerge.exe" `
            -DGETTEXT_MSGFMT_EXECUTABLE="C:/ProgramData/chocolatey/bin/msgfmt.exe"

      - name: Build MoneyManagerEx
        run: |
          cmake --build build --config Release --parallel

      - name: Copy wxWidgets Runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "C:\wxWidgets\lib\vc14x_x64_dll\*.dll" "build\bin\Release\" -Force -ErrorAction SilentlyContinue

      - name: Create Installer or Archive (.exe / .zip)
        shell: pwsh
        run: |
          cd build
          cpack -C Release -G "NSIS;ZIP"
          Get-ChildItem -Path . -Recurse -Include *.exe, *.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManagerEx-Windows-Exe
          path: |
            build/*.exe
            build/*.zip
            build/bin/Release/*.exe